volumes:
  smnrp-data:
services:
  ws:
    image: ethnexus/smnrpx:2.9.4@sha256:8551d5378715ac99579abf2ab69e75717d8ef7baaeb19ce95884b4a0a4673004
    volumes:
      # smnrpx serves /web_root/<domain>, so the ui build goes there
      - web_root:/web_root/revseq.nexus.ethz.ch
      - smnrp-data:/etc/letsencrypt
      - ./api/static:/vol/web/static:z
      - ./api/media:/vol/web/media:z
      - ./smnrp.yml:/run/configs/smnrp.yml:ro,z
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: service nginx status || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - api
  api:
    volumes:
       - /data/revseq/results/gather_results:/data
       - /data/revseq/results/results:/data/revseq/results/results
       - /data/revseq/metagenomics_integration_proof-of-concept/results/results:/data/revseq/metagenomics_integration_proof-of-concept/results/results
      #- ./data:/data
  ui:
    command: >
      bash -c "\
        yarn install
        rm -rf /app/dist/*
        yarn run build
        mv /app/dist/spa/* /app/dist/.
        rm -rf /app/dist/spa
      "
  ena:
    ports:
      - 5042:5000
    volumes:
      - /data/revseq/results/gather_results:/data
      # - /data/revseq/results/results:/data/revseq/results/results
      # - ./data:/data2
      # - ./data:/data
